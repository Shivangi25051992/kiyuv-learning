# Kiyuv Learning Academy — Firebase SQL Connect (Data Connect) Schema

# Parent / Family Account linked to Firebase Auth
type User @table(key: "uid") {
  uid: String! @default(expr: "auth.uid")
  email: String! @unique
  displayName: String @col(dataType: "varchar(120)")
  photoUrl: String
  lastActiveDate: String @col(dataType: "varchar(16)")
  lastSeen: Timestamp! @default(expr: "request.time")
  createdAt: Timestamp! @default(expr: "request.time")
}

# Child profile and overall gamified progress (e.g., Yuvin, Kiki, or additional children)
type KidProfile @table(key: ["parent", "kidId"]) {
  parent: User!
  kidId: String! @col(dataType: "varchar(32)")
  name: String! @col(dataType: "varchar(64)")
  emoji: String @col(dataType: "varchar(16)")
  age: Int
  targetGrade: String @col(dataType: "varchar(64)")
  stars: Int! @default(value: 0)
  streak: Int! @default(value: 0)
  bestStreak: Int! @default(value: 0)
  totalCorrect: Int! @default(value: 0)
  totalWrong: Int! @default(value: 0)
  badges: [String!]
  updatedAt: Timestamp! @default(expr: "request.time")
}

# Per-topic mastery and session stats for each child
type TopicProgress @table(key: ["parent", "kidId", "topicId"]) {
  parent: User!
  kidId: String! @col(dataType: "varchar(32)")
  topicId: String! @col(dataType: "varchar(64)")
  played: Int! @default(value: 0)
  correct: Int! @default(value: 0)
  bestStreak: Int! @default(value: 0)
  mastered: Boolean! @default(value: false)
  updatedAt: Timestamp! @default(expr: "request.time")
}

# Curriculum Subject catalog (CBSE, US Common Core, UK National Curriculum, AU ACARA, Olympiad)
type CurriculumSubject @table(key: "id") @index(fields: ["kidTrack", "sortOrder"], order: [ASC, ASC]) {
  id: String! @col(dataType: "varchar(64)")
  kidTrack: String! @col(dataType: "varchar(32)")
  emoji: String! @col(dataType: "varchar(16)")
  name: String! @col(dataType: "varchar(120)")
  grade: String! @col(dataType: "varchar(80)")
  systems: [String!]!
  sortOrder: Int! @default(value: 0)
}

# Curriculum Topic within a Subject
type CurriculumTopic @table(key: "id") {
  id: String! @col(dataType: "varchar(64)")
  subject: CurriculumSubject!
  name: String! @col(dataType: "varchar(120)")
  difficulty: Int! @default(value: 1)
  generatorKey: String @col(dataType: "varchar(64)")
  sortOrder: Int! @default(value: 0)
}

# Expandable Question Bank item for a Curriculum Topic
type QuestionBankItem @table {
  id: UUID! @default(expr: "uuidV4()")
  topic: CurriculumTopic!
  questionText: String!
  answer: String!
  options: [String!]!
  hint: String
  difficulty: Int! @default(value: 2)
  createdAt: Timestamp! @default(expr: "request.time")
}
